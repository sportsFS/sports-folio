name: Deploy to cPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy via FTP
        run: |
          cd dist
          find . -type f | while IFS= read -r f; do
            echo "Uploading: $f"
            curl --ftp-create-dirs --ftp-pasv -T "$f" \
              "ftp://${{ secrets.FTP_HOST }}/$f" \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 5 \
              --insecure --silent
          done
